<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naomi · prueba de caminata</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161d2f; color: #f9edd6; font: 16px system-ui, sans-serif; }
  main { max-width: 600px; padding: 24px; text-align: center; }
  h1 { font-size: 1.3rem; }
  canvas { display: block; width: min(85vw, 420px); height: auto; margin: 16px auto; background: #303c50; border-radius: 12px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
  p { line-height: 1.5; }
</style>
<main>
  <h1>Naomi · prueba de caminata</h1>
  <p>Un primer estudio de cuatro cuadros. Aún hay que ajustar las poses y limpiar los bordes.</p>
  <canvas id="preview" width="624" height="631" aria-label="Prueba de caminata de Naomi"></canvas>
  <button id="toggle" type="button">Pausar</button>
  <p id="status" aria-live="polite">Cargando imágenes…</p>
</main>
<script>
  const canvas = document.querySelector('#preview');
  const context = canvas.getContext('2d');
  const button = document.querySelector('#toggle');
  const status = document.querySelector('#status');
  const sheet = new Image();
  let frame = 0;
  let playing = true;
  function draw() {
    const w = sheet.naturalWidth / 2;
    const h = sheet.naturalHeight / 2;
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.drawImage(sheet, (frame % 2) * w, Math.floor(frame / 2) * h, w, h, 0, 0, canvas.width, canvas.height);
    status.textContent = `Cuadro ${frame + 1} de 4`;
  }
  sheet.onload = () => {
    draw();
    setInterval(() => { if (playing) { frame = (frame + 1) % 4; draw(); } }, 220);
  };
  sheet.onerror = () => { status.textContent = 'No se pudo cargar la hoja de imágenes.'; };
  button.addEventListener('click', () => { playing = !playing; button.textContent = playing ? 'Pausar' : 'Reproducir'; });
  sheet.src = 'caminar-4-cuadros-borrador.png';
</script>
</html>
