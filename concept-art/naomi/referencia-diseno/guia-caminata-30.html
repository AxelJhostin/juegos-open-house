<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naomi · guía de caminata de 30 cuadros</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161d2f; color: #f9edd6; font: 16px system-ui, sans-serif; }
  main { max-width: 580px; padding: 24px; text-align: center; }
  h1 { font-size: 1.35rem; }
  p { line-height: 1.5; }
  canvas { display: block; width: min(82vw, 360px); height: auto; margin: 16px auto; background: #f7f5ef; border-radius: 12px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
  .red { color: #ff8882; } .blue { color: #8cc1ff; }
</style>
<main>
  <h1>Guía de caminata · 30 cuadros</h1>
  <p>Un esquema para seguir ambas piernas y revisar los apoyos. Es una guía de movimiento; todavía no son los sprites finales de Naomi.</p>
  <canvas id="preview" width="360" height="420" aria-label="Esquema animado de caminata"></canvas>
  <p><span class="red">● Pierna roja</span> · <span class="blue">● Pierna azul</span></p>
  <button id="toggle" type="button">Pausar</button>
  <p id="status" aria-live="polite"></p>
</main>
<script>
  const canvas = document.querySelector('#preview');
  const ctx = canvas.getContext('2d');
  const toggle = document.querySelector('#toggle');
  const status = document.querySelector('#status');
  const count = 30;
  let frame = 0;
  let playing = true;
  const hipX = 180;
  const groundY = 360;
  function line(points, color, width) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function leg(phase, hipY, color) {
    const stance = 0.6;
    const x = phase < stance ? 42 - 84 * phase / stance : -42 + 84 * (phase - stance) / (1 - stance);
    const lift = phase < stance ? 0 : 22 * Math.sin(Math.PI * (phase - stance) / (1 - stance));
    const foot = [hipX + x, groundY - lift];
    const dx = foot[0] - hipX;
    const dy = foot[1] - hipY;
    const distance = Math.hypot(dx, dy);
    const bend = Math.sqrt(Math.max(0, 72 * 72 - distance * distance / 4));
    const knee = [hipX + dx / 2 + dy / distance * bend, hipY + dy / 2 - dx / distance * bend];
    line([[hipX, hipY], knee, foot, [foot[0] + 18, foot[1]]], color, 10);
  }
  function draw() {
    const phase = frame / count;
    const hipY = 229 + 2 * Math.cos(phase * Math.PI * 4);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    line([[50, groundY], [310, groundY]], '#999792', 2);
    leg((phase + 0.5) % 1, hipY, '#3278d0');
    leg(phase, hipY, '#d84b47');
    line([[hipX, hipY], [hipX, hipY - 110]], '#273245', 11);
    line([[hipX - 30, hipY - 75], [hipX + 30, hipY - 75]], '#273245', 8);
    ctx.beginPath();
    ctx.arc(hipX, hipY - 132, 18, 0, Math.PI * 2);
    ctx.strokeStyle = '#273245';
    ctx.lineWidth = 8;
    ctx.stroke();
    status.textContent = `Cuadro ${frame + 1} de ${count}`;
  }
  toggle.addEventListener('click', () => { playing = !playing; toggle.textContent = playing ? 'Pausar' : 'Reproducir'; });
  draw();
  setInterval(() => { if (playing) { frame = (frame + 1) % count; draw(); } }, 50);
</script>
</html>
